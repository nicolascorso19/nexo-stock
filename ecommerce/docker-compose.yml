services:
  store:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      - store_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  store_data:
