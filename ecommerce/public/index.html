<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="NEXO Tech — smartphones y accesorios seleccionados.">
    <meta name="color-scheme" content="light">
    <title>NEXO Tech</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <!-- Sin aria-live: cada render reemplaza el innerHTML entero, así que el
         lector de pantalla reanunciaba la página completa en cada cambio de
         variante o de filtro. Los avisos viven en #toast-region. -->
    <div id="app">
      <div class="boot-screen"><div class="brand-mark">N</div><p>Cargando la experiencia...</p></div>
    </div>
    <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
    <noscript>Necesitás activar JavaScript para comprar en NEXO Tech.</noscript>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
